name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Patch graph plugin
        run: |
          python3 -c '
          import sys
          for f in [".quartz/plugins/graph/dist/index.js", ".quartz/plugins/graph/dist/components/index.js"]:
            c = open(f).read()
            n = c.replace("a.startsWith(\"/\")&&(a=a.slice(1))),a}", "a.startsWith(\"/\")&&(a=a.slice(1))),decodeURIComponent(a)}")
            if c == n:
              print("FAIL: no match in " + f)
              sys.exit(1)
            open(f, "w").write(n)
            print("PATCHED: " + f)
          '
      - name: Patch comments plugin
        run: |
          python3 -c '
          f = ".quartz/plugins/comments/dist/components/index.js"
          c = open(f).read()
          o = "if(!e)return;let t=document.createElement(\"script\");t.src=\"https://giscus.app/client.js\""
          n = "if(!e)return;e.innerHTML=\"\";let t=document.createElement(\"script\");t.src=\"https://giscus.app/client.js\""
          if o not in c:
            print("FAIL: pattern not found")
            sys.exit(1)
          c = c.replace(o, n)
          open(f, "w").write(c)
          print("PATCHED: " + f)
          '
      - name: Patch content-index plugin
        run: |
          python3 -c '
          f = ".quartz/plugins/content-index/dist/index.js"
          c = open(f).read()
          o = "delete content2.description;\n        delete content2.date;"
          n = "if (!content2.description) delete content2.description;"
          if o not in c:
            print("FAIL: pattern not found")
            sys.exit(1)
          c = c.replace(o, n)
          open(f, "w").write(c)
          print("PATCHED: " + f)
          '
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4